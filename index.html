<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090914">
    <title>67 Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <header>
        <h1>67 CLICKER</h1>

        <div class="stats">
            <div>
                <span>67</span>
                <strong id="coins">0</strong>
            </div>

            <div>
                <span>Уровень</span>
                <strong id="level">1</strong>
            </div>

            <div>
                <span>67/сек</span>
                <strong id="perSecond">0</strong>
            </div>
        </div>
    </header>


    <main>

        <section class="click-area">

            <div id="character" class="character classic">
                <div class="character-glow"></div>

                <div class="character-head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="smile"></div>
                </div>

                <div class="character-body">
                    <div class="symbol">67</div>
                </div>

                <div class="character-arm left-arm"></div>
                <div class="character-arm right-arm"></div>

                <div class="character-leg left-leg"></div>
                <div class="character-leg right-leg"></div>

                <div class="skin-particles"></div>
            </div>

            <button id="clickButton" class="click-button">
                67
            </button>

            <p>
                Сила клика:
                <b id="clickPower">1</b>
            </p>

        </section>


        <section class="panel">

            <h2>🛒 Магазин</h2>

            <button id="buyClick">
                Улучшить клик —
                <b id="clickCost">25</b> 67
            </button>

            <button id="buyAuto">
                Автокликер —
                <b id="autoCost">100</b> 67
            </button>

            <button id="buyMultiplier">
                Улучшить множитель —
                <b id="multiplierCost">500</b> 67
            </button>

        </section>


        <section class="panel">

            <h2>🎨 Скины</h2>

            <div id="skins"></div>

        </section>


        <section class="panel">

            <h2>🎯 Задания</h2>

            <div id="missions"></div>

        </section>


        <section class="panel">

            <h2>🏆 Достижения</h2>

            <div id="achievements"></div>

        </section>


        <section class="panel">

            <h2>🎁 Ежедневный бонус</h2>

            <button id="dailyReward">
                Получить бонус
            </button>

            <p id="dailyStatus"></p>

        </section>


        <button id="resetGame" class="reset">
            Сбросить прогресс
        </button>

    </main>

</div>


<div id="notification"></div>


<script src="js/save.js"></script>
<script src="js/player.js"></script>
<script src="js/shop.js"></script>
<script src="js/skins.js"></script>
<script src="js/missions.js"></script>
<script src="js/achievements.js"></script>
<script src="js/game.js"></script>

</body>
</html>
